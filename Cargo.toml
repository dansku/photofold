[package]
name = "photofold"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Merge photo folders, remove duplicates, and keep the best copy of each picture"
authors = ["Daniel Andrade <daniel@danielandrade.net>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dansku/photofold"
homepage = "https://github.com/dansku/photofold"
documentation = "https://docs.rs/photofold"
readme = "README.md"
keywords = ["photos", "deduplication", "heic", "exif", "cli"]
categories = ["command-line-utilities", "multimedia::images", "filesystem"]
exclude = ["plan.md", ".github/"]

[features]
default = ["heic"]
# HEIC/HEIF support through the system libheif.
# Needs: brew install libheif pkg-config  (macOS)
#        apt install libheif-dev pkg-config  (Debian/Ubuntu)
heic = ["dep:libheif-rs"]

[dependencies]
anyhow = "1.0.104"
blake3 = { version = "1.8.7", features = ["mmap"] }
clap = { version = "4.6.6", features = ["derive"] }
csv = "1.4.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
image_hasher = "3.1.1"
indicatif = "0.18.6"
jpeg-decoder = "0.3.2"
libheif-rs = { version = "3.0.0", optional = true }
nom-exif = "3.6.2"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "serde", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
# A photo library is large; the extra build time pays for itself on the first run.
lto = "thin"
codegen-units = 1
strip = "symbols"
