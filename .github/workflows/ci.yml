name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Formatting is the same on every platform, so it only needs to run once.
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: ${{ matrix.os }} / ${{ matrix.features }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The build without HEIC support has to keep working: it is what the
        # released binaries use, and it must pass the same tests.
        features: ["default", "no-default-features"]
    steps:
      - uses: actions/checkout@v5

      - name: Install libheif (Linux)
        if: matrix.os == 'ubuntu-latest' && matrix.features == 'default'
        run: sudo apt-get update && sudo apt-get install -y libheif-dev pkg-config

      - name: Install libheif (macOS)
        if: matrix.os == 'macos-latest' && matrix.features == 'default'
        run: brew install libheif pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}

      - name: Clippy
        run: |
          if [ "${{ matrix.features }}" = "default" ]; then
            cargo clippy --all-targets -- -D warnings
          else
            cargo clippy --all-targets --no-default-features -- -D warnings
          fi

      - name: Test
        run: |
          if [ "${{ matrix.features }}" = "default" ]; then
            cargo test --all-targets
          else
            cargo test --all-targets --no-default-features
          fi

  # Proves the rust-version in Cargo.toml is true.
  minimum-rust-version:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libheif-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
