name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting is identical on every platform, so it only needs to run once.
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The portable build links no system libraries. It is what the
          # released binaries use, so it has to pass everywhere.
          - name: Linux, portable build
            os: ubuntu-latest
            flags: --no-default-features
          - name: macOS, portable build
            os: macos-latest
            flags: --no-default-features
          # HEIC support needs libheif 1.23 or newer. Homebrew has it; no
          # current Debian or Ubuntu release does, so this job is macOS only.
          - name: macOS, with HEIC
            os: macos-latest
            flags: ""
            libheif: true
    steps:
      - uses: actions/checkout@v7

      - name: Install libheif
        if: matrix.libheif
        run: brew install libheif pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - run: cargo clippy --all-targets ${{ matrix.flags }} -- -D warnings
      - run: cargo test --all-targets ${{ matrix.flags }}

  # Proves the rust-version in Cargo.toml is true, over the whole code including
  # the HEIC backend, so it runs where libheif is available.
  minimum-rust-version:
    name: Minimum supported Rust
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: brew install libheif pkg-config
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
